<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <!-- Corps du rhinocéros -->
  <ellipse cx="105" cy="130" rx="55" ry="35" fill="url(#bodyGrad)" stroke="#E66A00" stroke-width="2"/>
  <!-- Tête -->
  <ellipse cx="60" cy="115" rx="30" ry="22" fill="url(#bodyGrad)" stroke="#E66A00" stroke-width="2"/>
  <!-- Corne principale -->
  <polygon points="42,100 38,55 48,100" fill="url(#hornGrad)" stroke="#D97706" stroke-width="1.5"/>
  <!-- Petite corne -->
  <polygon points="55,100 52,75 58,100" fill="url(#hornGrad)" stroke="#D97706" stroke-width="1"/>
  <!-- Œil -->
  <circle cx="52" cy="110" r="4" fill="white"/>
  <circle cx="52" cy="110" r="2.5" fill="#1A1A1A"/>
  <!-- Oreille -->
  <ellipse cx="78" cy="98" rx="6" ry="8" fill="url(#bodyGrad)" stroke="#E66A00" stroke-width="1.5" transform="rotate(-15,78,98)"/>
  <!-- Patte avant -->
  <rect x="72" y="155" width="14" height="25" rx="5" fill="url(#bodyGrad)" stroke="#E66A00" stroke-width="1.5"/>
  <!-- Patte arrière -->
  <rect x="120" y="155" width="14" height="25" rx="5" fill="url(#bodyGrad)" stroke="#E66A00" stroke-width="1.5"/>
  <!-- Queue -->
  <path d="M158,130 Q170,125 165,140" fill="none" stroke="#E66A00" stroke-width="3" stroke-linecap="round"/>
  <!-- Étoile IA sur la tête -->
  <text x="85" y="88" font-size="16" text-anchor="middle">✨</text>
</svg>